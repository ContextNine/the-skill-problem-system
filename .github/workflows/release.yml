name: Release

on:
  push:
    tags: ["v*"]

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: test "$GITHUB_REF_NAME" = "$(python3 -c 'import json; print(json.load(open("release.json"))["tag"])')"
      - run: python3 -m unittest discover -s internal/tests
      - run: python3 scripts/build_release.py
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: dist-release/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
