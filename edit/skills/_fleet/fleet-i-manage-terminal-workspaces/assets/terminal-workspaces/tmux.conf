# Managed by fleet-i-manage-terminal-workspaces/sync_terminal_profiles.py.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_command}"
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#101010,fg=#6F6F6F"
set -g status-left-length 60
set -g status-right-length 60
set -g status-left "#[fg=#101010,bg=#FFAF5F,bold] #S #[default] #[fg=#FFAF5F]#(~/.local/bin/workmux-git-branch \"#{pane_current_path}\") #[default]"
set -g window-status-format " #[fg=#6F6F6F]#I:#W "
set -g window-status-current-format "#[fg=#101010,bg=#FFAF5F,bold] #I:#W #[default]"
set -g window-status-separator ""
set -g status-right "#[fg=#101010,bg=#FFAF5F,bold] CPU #{cpu_percentage} · MEM #{ram_percentage} #[default]"

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind n select-window -n
bind p select-window -p
bind l select-window -l

# Replace managed btop with an idle sleep while its tmux window is hidden.
# Start fresh btop when selected, avoiding long-lived macOS Runner-thread stalls.
set-hook -g after-select-window 'run-shell -b "/bin/sleep 0.1; ~/.local/bin/workmux-btop-control \"#{session_name}\""'
set-hook -g client-attached 'run-shell -b "/bin/sleep 0.1; ~/.local/bin/workmux-btop-control \"#{hook_session_name}\""'
set-hook -g client-detached 'run-shell -b "/bin/sleep 0.1; ~/.local/bin/workmux-btop-control \"#{hook_session_name}\""'

set -g @resurrect-processes "btop"
set -g @resurrect-capture-pane-contents "off"
set -g @continuum-save-interval "15"
# workmux performs one locked explicit restore; Continuum only saves.
set -g @continuum-restore "off"

run-shell ~/.local/share/workmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.local/share/workmux/plugins/tmux-cpu/cpu.tmux
# Continuum must load last because it hooks status-right for periodic saves.
run-shell ~/.local/share/workmux/plugins/tmux-continuum/continuum.tmux
