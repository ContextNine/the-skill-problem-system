<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document title</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface: #111;
      --text: #fff;
      --muted: #aaa;
      --line: #333;
      --link: #fff;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: clamp(32px, 7vw, 80px) 0; }
    h1, h2, h3 { line-height: 1.2; }
    h1 { margin: 0 0 1.5rem; font-size: clamp(2rem, 6vw, 3.25rem); }
    h2 { margin: 3rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
    p, li { max-width: 72ch; }
    a { color: var(--link); text-underline-offset: .16em; }
    code { padding: .12em .32em; background: var(--surface); font: 85%/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { overflow-x: auto; padding: 16px; background: var(--surface); }
    pre code { padding: 0; background: none; }
    table { display: block; overflow-x: auto; width: 100%; border-collapse: collapse; }
    th, td { padding: .65em .8em; border: 1px solid var(--line); text-align: left; }
    th { background: var(--surface); }
    .muted { color: var(--muted); }
    @media (max-width: 600px) {
      main { width: min(100% - 24px, 960px); padding: 24px 0 48px; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Document title</h1>
      <p class="muted">Short context or summary.</p>
    </article>
  </main>
</body>
</html>
